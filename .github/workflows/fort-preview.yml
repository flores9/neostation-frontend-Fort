name: Fort Preview Android

on:
  push:
    branches:
      - 'fort/beta-0.11.5-esde-vnext'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-and-build:
    name: Validate overlay and build Android Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Fort branch
        uses: actions/checkout@v7

      - name: Verify pinned upstream baseline
        shell: bash
        run: |
          BASE='de7de7d5584c815769817cc74f1745d28800d7be'
          git merge-base --is-ancestor "$BASE" HEAD
          echo "Fort branch contains upstream baseline $BASE"

      - name: Apply Fort vNext code overlay
        run: python3 fort/apply_fort_vnext.py

      - name: Make package coexist with official NeoStation
        shell: bash
        run: |
          sed -i 's/applicationId = "com.neogamelab.neostation"/applicationId = "com.neogamelab.neostation.preview"/' android/app/build.gradle.kts
          sed -i 's/manifestPlaceholders\["appName"\] = "NeoStation"/manifestPlaceholders["appName"] = "NeoStation Fort Preview"/' android/app/build.gradle.kts
          grep -n 'applicationId\|appName' android/app/build.gradle.kts

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format Fort-touched Dart sources
        run: |
          dart format \
            lib/utils/fort_android_rom_path.dart \
            lib/services/esde_visibility_service.dart \
            lib/services/launcher_service.dart \
            lib/services/game/game_list_service.dart \
            lib/screens/search_screen/search_screen.dart \
            test/fort_android_rom_path_test.dart

      - name: Analyze project
        run: flutter analyze

      - name: Run full tests
        run: flutter test

      - name: Build ARM64 Preview APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Record build provenance
        shell: bash
        run: |
          mkdir -p build/fort
          {
            echo 'NeoStation Fort Preview'
            echo 'upstream_base=de7de7d5584c815769817cc74f1745d28800d7be'
            echo "fort_head=${GITHUB_SHA}"
            echo 'package=com.neogamelab.neostation.preview'
          } > build/fort/PROVENANCE.txt
          sha256sum build/app/outputs/flutter-apk/app-release.apk | tee build/fort/SHA256.txt

      - name: Upload Preview APK
        uses: actions/upload-artifact@v7
        with:
          name: neostation-fort-preview-android-arm64
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/fort/PROVENANCE.txt
            build/fort/SHA256.txt
          if-no-files-found: error
