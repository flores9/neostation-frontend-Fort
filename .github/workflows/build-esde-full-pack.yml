name: Build ES-DE full systems pack

on:
  push:
    branches:
      - fort-esde-pack-builder-20260903

permissions:
  contents: read

jobs:
  build-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize corrected ES-DE systems pack
        shell: bash
        run: |
          cat > /tmp/builder.py.gz.b64 <<'B64'

B64
          base64 -d /tmp/builder.py.gz.b64 | gzip -d > /tmp/build_esde_system_pack.py
          python3 /tmp/build_esde_system_pack.py
          find dist/NeoStation-ESDE-full-systems-pack/systems -maxdepth 1 -name '*.json' -print | sort
      - name: Upload complete systems pack
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation_ESDE_full_systems_pack_20260903
          path: dist/NeoStation-ESDE-full-systems-pack/
          if-no-files-found: error
          compression-level: 9
