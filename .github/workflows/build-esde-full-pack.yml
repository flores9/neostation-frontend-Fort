name: Build ES-DE full systems pack

on:
  push:
    branches:
      - fort-esde-pack-builder-20260903

permissions:
  contents: read

jobs:
  build-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize and validate systems pack
        shell: bash
        run: |
          base64 -d tools/esde_full_pack_builder.py.gz.b64 | gzip -d > tools/build_esde_system_pack.py
          python3 tools/build_esde_system_pack.py
          test -f dist/NeoStation-ESDE-full-systems-pack/AUDIT_ESDE_ALIGNMENT.md
      - name: Upload complete systems pack
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation_ESDE_full_systems_pack_20260903
          path: dist/NeoStation-ESDE-full-systems-pack/
          if-no-files-found: error
          compression-level: 9
